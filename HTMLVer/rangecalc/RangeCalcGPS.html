<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RangeCalc GPS + Map</title>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { transition: background-color 0.3s; }
        #map { height: 400px; border-radius: 8px; }
        .result { font-size: 2.2rem; font-weight: 700; }
    </style>
</head>
<body data-bs-theme="dark">
    <div class="container py-4">
        <h1 class="text-center mb-4">RangeCalc GPS + Map</h1>

        <div class="card shadow">
            <div class="card-body">
                <form id="gpsForm">
                    <div class="row mb-3">
                        <div class="col-6">
                            <label class="form-label">Ref 1</label>
                            <button type="button" class="btn btn-sm btn-outline-primary w-100" onclick="getGPS(1)">📍 Get GPS</button>
                            <input type="text" id="gps1" class="form-control mt-1" readonly placeholder="Lat, Lng">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Ref 2</label>
                            <button type="button" class="btn btn-sm btn-outline-primary w-100" onclick="getGPS(2)">📍 Get GPS</button>
                            <input type="text" id="gps2" class="form-control mt-1" readonly placeholder="Lat, Lng">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Target (for verification - optional)</label>
                        <button type="button" class="btn btn-sm btn-outline-success w-100" onclick="getGPS(3)">📍 Get Target GPS</button>
                        <input type="text" id="gpsTarget" class="form-control mt-1" readonly placeholder="Lat, Lng">
                    </div>

                    <div class="row">
                        <div class="col-6">
                            <label class="form-label">Bearing from Ref 1</label>
                            <input type="number" class="form-control" id="b1" min="1" max="360" placeholder="45">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Bearing from Ref 2</label>
                            <input type="number" class="form-control" id="b2" min="1" max="360" placeholder="90">
                        </div>
                    </div>

                    <div class="mt-4">
                        <label class="form-label">Method</label>
                        <select class="form-select" id="method">
                            <option value="1">Simple (fast)</option>
                            <option value="2" selected>Full Triangulation (accurate)</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 mt-4">Calculate & Show Map</button>
                </form>
            </div>
        </div>

        <!-- Results -->
        <div id="resultContainer" class="mt-4 d-none">
            <div class="alert alert-success">
                <strong>Range from Ref 1:</strong> <span id="range1"></span><br>
                <strong>Range from Ref 2:</strong> <span id="range2"></span><br>
                <strong>Baseline:</strong> <span id="baseline"></span> m
            </div>
        </div>

        <!-- Map -->
        <div id="mapContainer" class="mt-4 d-none">
            <h5 class="mb-2">📍 Map View</h5>
            <div id="map"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let pos1 = null, pos2 = null, posTarget = null;
        let map = null, markers = [];

        function getGPS(ref) {
            if (!navigator.geolocation) return alert("GPS not supported on this device");
            
            navigator.geolocation.getCurrentPosition(pos => {
                const latlng = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
                if (ref === 1) { document.getElementById('gps1').value = latlng; pos1 = pos.coords; }
                else if (ref === 2) { document.getElementById('gps2').value = latlng; pos2 = pos.coords; }
                else if (ref === 3) { document.getElementById('gpsTarget').value = latlng; posTarget = pos.coords; }
            }, () => alert("Failed to get location. Check permissions."));
        }

        document.getElementById('gpsForm').addEventListener('submit', e => {
            e.preventDefault();

            if (!pos1 || !pos2) return alert("Please get GPS for Ref 1 and Ref 2");

            const b1 = parseFloat(document.getElementById('b1').value);
            const b2 = parseFloat(document.getElementById('b2').value);
            if (!b1 || !b2) return alert("Enter both bearings");

            const baseline = calculateDistance(pos1.latitude, pos1.longitude, pos2.latitude, pos2.longitude);
            const baselineBearing = calculateBearing(pos1.latitude, pos1.longitude, pos2.latitude, pos2.longitude);

            const result = calculateFullTriangulation(b1, b2, baseline, baselineBearing);

            // Show results
            document.getElementById('range1').textContent = result.range1.toFixed(2) + " m";
            document.getElementById('range2').textContent = result.range2.toFixed(2) + " m";
            document.getElementById('baseline').textContent = baseline.toFixed(1);
            document.getElementById('resultContainer').classList.remove('d-none');

            // Show map
            showMap(pos1, pos2, posTarget, result.range1, result.range2);
        });

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function calculateBearing(lat1, lon1, lat2, lon2) {
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
            const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                      Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
            let brng = Math.atan2(y, x) * 180 / Math.PI;
            return (brng + 360) % 360;
        }

        function calculateFullTriangulation(b1, b2, baseline, baselineBearing) {
            let angleAtTarget = Math.abs(b1 - b2);
            if (angleAtTarget > 180) angleAtTarget = 360 - angleAtTarget;

            let angleAtRef1 = Math.abs(baselineBearing - b1);
            if (angleAtRef1 > 180) angleAtRef1 = 360 - angleAtRef1;

            const angleAtRef2 = 180 - angleAtTarget - angleAtRef1;
            const sinTarget = Math.sin(angleAtTarget * Math.PI / 180);

            const range1 = baseline * Math.sin(angleAtRef2 * Math.PI / 180) / sinTarget;
            const range2 = baseline * Math.sin(angleAtRef1 * Math.PI / 180) / sinTarget;

            return { range1, range2 };
        }

        function showMap(p1, p2, pTarget, range1, range2) {
            const mapContainer = document.getElementById('mapContainer');
            mapContainer.classList.remove('d-none');

            if (map) map.remove();

            map = L.map('map', { zoomControl: true }).setView([p1.latitude, p1.longitude], 15);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            // Markers
            L.marker([p1.latitude, p1.longitude]).addTo(map).bindPopup("Ref 1").openPopup();
            L.marker([p2.latitude, p2.longitude]).addTo(map).bindPopup("Ref 2");

            // Target GPS (verification)
            if (pTarget) {
                L.marker([pTarget.latitude, pTarget.longitude], {color: 'green'}).addTo(map)
                 .bindPopup("Actual Target GPS").openPopup();
            }

            // Circles showing calculated range
            L.circle([p1.latitude, p1.longitude], {radius: range1, color: '#0d6efd'}).addTo(map)
             .bindPopup(`Range from Ref 1: ${range1.toFixed(1)} m`);
            L.circle([p2.latitude, p2.longitude], {radius: range2, color: '#198754'}).addTo(map)
             .bindPopup(`Range from Ref 2: ${range2.toFixed(1)} m`);

            // Baseline line
            L.polyline([[p1.latitude, p1.longitude], [p2.latitude, p2.longitude]], {color: 'orange'}).addTo(map);
        }
    </script>
</body>
</html>
